name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy (deny warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy pedantic (informational)
        env:
          RUSTFLAGS: ""
        run: cargo clippy --all-targets -- -W clippy::pedantic -W clippy::cargo 2>&1 | tail -60 || true

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit + integration tests
        run: cargo test --all-features --workspace
      - name: Doc tests
        run: cargo test --doc

  javahelper:
    name: seedgen helper bytecode fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Rebuild java helper bytecode and diff against the committed one
        run: |
          JAVAC="$(which javac)" bash scripts/java/build.sh
          for f in java/ClodSeedgen.class 'java/ClodSeedgen$GenModel.class' java/ClodEdits.class; do
            test "$(sha1sum "$f" | cut -d' ' -f1)" = \
                 "$(git show "HEAD:$f" | sha1sum | cut -d' ' -f1)" || {
              echo "FAIL: $f is stale — run scripts/java/build.sh and commit";
              exit 1;
            }
          done
      # v6.1: the full helper preflight (61 checks x two JVMs: terrain parity
      # vs the v5.9 ground truth, batch structure, stride paths, and the
      # SEEDGEN TREES stage through the real proxy surface) — no Paper needed.
      - name: SEEDGEN preflight (mock hierarchy, both layouts)
        run: bash scripts/java/preflight/run.sh "$(which javac)"
      # Recovery artifact: if a javac point-release ever shifts the bytecode,
      # the canonical rebuild lands here for the next commit.
      - name: Upload recompiled bytecode (recovery artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seedgen-bytecode
          path: |
            java/ClodSeedgen.class
            java/ClodSeedgen$GenModel.class
            java/ClodEdits.class
          if-no-files-found: error

  glsl:
    name: shader validation (glslang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install glslangValidator
        run: |
          curl -sL -o /tmp/glslang.tar.gz \
            "https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-linux-x86_64-release.tar.gz"
          tar xzf /tmp/glslang.tar.gz -C /tmp
          echo "/tmp/bin" >> "$GITHUB_PATH"
      - name: Validate shaders + chain JSONs
        run: bash scripts/check_glsl.sh
      - name: Pack sanity (unit tests build the real pack zip)
        run: cargo test -p lod pack_builds -- --nocapture

  build:
    name: release build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: liblod.so
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: liblod.dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: lod.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (release, deny warnings)
        run: cargo build --release --all-targets
      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: lod-${{ matrix.target }}
          path: |
            target/release/${{ matrix.artifact }}
            module.json
          if-no-files-found: error

  packaging:
    name: module bundle (CRUSSTY tar.gz)
    needs: [fmt, clippy, test, glsl, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - name: Pack like `crussty module pack`
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('module.json'))['version'])")
          mkdir -p "dist/lod-v${VERSION}-linux-x64"
          cp target/release/liblod.so "dist/lod-v${VERSION}-linux-x64/"
          cp module.json "dist/lod-v${VERSION}-linux-x64/"
          tar czf "dist/lod-v${VERSION}-linux-x64.tar.gz" -C dist "lod-v${VERSION}-linux-x64"
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: crussty-bundle
          path: dist/*.tar.gz
          if-no-files-found: error

  e2e-live:
    name: e2e live server (Paper 26.3 + CRUSSTY + static-pack gates)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Build module (release)
        run: cargo build --release
      - name: Build CRUSSTY runtime + launcher
        run: |
          git clone --depth 1 https://github.com/PLANETA9091/CRUSSTY.git crussty
          cargo build --release --manifest-path crussty/runtime/Cargo.toml
          mkdir -p crussty/launcher/out
          javac -d crussty/launcher/out crussty/launcher/src/main/java/dev/dist/launcher/Main.java
          jar cfe crussty/launcher/launcher.jar dev.dist.launcher.Main -C crussty/launcher/out .
      - name: Fetch Paper 26.3
        run: |
          URL=$(curl -s https://fill.papermc.io/v3/projects/paper/versions/26.3/builds/latest \
            | python3 -c "import json,sys;print(json.load(sys.stdin)['downloads']['server:default']['url'])")
          curl -sL -o paper.jar "$URL"
          mkdir -p dist/versions
          cp paper.jar dist/versions/paper-26.3.jar
      - name: Build c-LoD host plugin (ClodEdits needs one enabled plugin)
        run: |
          # v6.4.6.2: paper.jar is a paperclip BOOTSTRAP (no API classes) and
          # paper-api alone is not enough either — JavaPlugin's hierarchy
          # pulls adventure (Plugin -> Keyed -> Namespaced), javac dies with
          # 'cannot access Namespaced'. Verified locally with temurin 25:
          # paper-api + adventure-api + adventure-key (all 26.3.build.235 /
          # 5.2.0) compile ClodHost.class cleanly.
          APIV=$(curl -s https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml \
            | grep -o "26\.3\.build\.[0-9]*-stable" | tail -1)
          echo "paper-api: $APIV"
          B="https://repo.papermc.io/repository/maven-public"
          curl -sL -o paper-api.jar "$B/io/papermc/paper/paper-api/${APIV}/paper-api-${APIV}.jar"
          curl -sL -o adventure-api.jar "$B/net/kyori/adventure-api/5.2.0/adventure-api-5.2.0.jar"
          curl -sL -o adventure-key.jar "$B/net/kyori/adventure-key/5.2.0/adventure-key-5.2.0.jar"
          for j in paper-api adventure-api adventure-key; do
            test -s "$j.jar" || { echo "$j.jar download failed"; exit 1; }
          done
          mkdir -p dist/plugins hostout
          javac -cp paper-api.jar:adventure-api.jar:adventure-key.jar \
            -d hostout scripts/java/host/ClodHost.java \
            || { echo "javac failed"; exit 1; }
          jar cf dist/plugins/clodhost.jar -C hostout clod -C scripts/java/host plugin.yml
      - name: Assemble dist root
        run: |
          mkdir -p dist/modules/lod
          cp target/release/liblod.so dist/modules/lod/
          cp module.json dist/modules/lod/
          cp crussty/launcher/launcher.jar dist/
          cp crussty/runtime/target/release/libcrussty_runtime.so dist/
          printf 'eula=true\n' > dist/eula.txt
          {
            echo 'online-mode=false'
            echo 'white-list=false'
            echo 'enforce-secure-profile=false'
            echo 'view-distance=6'
            echo 'simulation-distance=6'
            echo 'server-port=25565'
            echo 'motd=c-LoD CI'
          } > dist/server.properties
      - name: "Boot #1 (fresh world, sky-grid streaming config)"
        working-directory: dist
        env:
          CLOD_OPTS: "tick_ms=200;region_blocks=512;cell_size=2;particles_per_tick=1024;http_port=8199;center_x=-930;center_z=796"
        run: |
          java -Xmx2G -jar launcher.jar > boot1.log 2>&1 &
          SRV=$!
          for i in $(seq 1 180); do
            if grep -q "pack finalized (ONE-TIME, static)" boot1.log; then break; fi
            if ! kill -0 $SRV 2>/dev/null; then echo "SERVER DIED"; tail -60 boot1.log; exit 1; fi
            sleep 2
          done
          if ! grep -q "pack finalized (ONE-TIME, static)" boot1.log; then
            tail -80 boot1.log; kill -9 $SRV 2>/dev/null || true; exit 1
          fi
          # v5.8: wait for the arm marker — it prints asynchronously after
          # pack finalize (the world resolve + lazy seedgen arm sit between
          # them); a single immediate grep was a race.
          for i in $(seq 1 60); do
            grep -q "sky-grid stream armed" boot1.log && break
            if ! kill -0 $SRV 2>/dev/null; then echo "SERVER DIED"; tail -60 boot1.log; exit 1; fi
            sleep 2
          done
          grep -q "sky-grid stream armed" boot1.log || { echo "sky-grid stream did not arm"; tail -80 boot1.log; exit 1; }
          # v6.4.6: with the host plugin the event push MUST register — the
          # bare-server "hunting a host plugin" forever state is a CI bug,
          # not a graceful fallback. Wait for it: define rides the first
          # engine ticks after the world resolve.
          for i in $(seq 1 60); do
            grep -q "edit events: listener registered" boot1.log && break
            if ! kill -0 $SRV 2>/dev/null; then echo "SERVER DIED"; tail -60 boot1.log; exit 1; fi
            sleep 2
          done
          grep -q "edit events: listener registered" boot1.log \
            || { echo "FAIL: event push never registered (host plugin missing or failed)"; tail -40 boot1.log; exit 1; }
          echo "--- gates ---"
          python3 ../scripts/e2e/gates.py boot1.log
          echo "--- HTTP pack fetch ---"
          curl -s -o pack1.zip -w "HTTP %{http_code}\n" http://127.0.0.1:8199/clod-pack.zip
          SIZE=$(stat -c%s pack1.zip); test "$SIZE" -gt 1024 || { echo "pack too small: $SIZE"; exit 1; }
          python3 - <<'EOF'
          import zipfile
          z = zipfile.ZipFile('pack1.zip')
          names = z.namelist()
          assert not [n for n in names if n.endswith('.png') or 'textures/' in n], f"TEXTURES IN PACK: {names}"
          # 13 entries since v5.3.2: mcmeta, 2 chains, col_scan, rot_solve,
          # rot_copy, capture, dust_mask (zero-residual pass), lod_terrain,
          # clod_blit, atmosphere, sky.vsh, sky.fsh.
          assert len(names) == 13, f"unexpected entry count {len(names)}: {names}"
          assert 'assets/clod/shaders/post/dust_mask.fsh' in names, "dust_mask (dust_eater) missing"
          chain = z.read('assets/clod/post_effect/lod_terrain.json').decode()
          assert 'clod:post/capture' in chain and 'clod_h_b' in chain and 'clod_c_b' in chain
          assert 'clod:post/dust_mask' in chain, "dust_eater pass missing from the chain"
          assert 'location' not in chain, "texture-input found in chain"
          print(f"pack verified: {len(names)} entries, zero textures, capture+dust_mask chain OK")
          EOF
          echo "--- stopping boot #1 ---"
          kill $SRV 2>/dev/null || true; sleep 3
          # v5.6 shutdown discipline: TERM the JVM, WAIT for a graceful exit
          # (chunk-save takes seconds; a TERM+KILL barrage SIGSEGV'd the
          # Signal Dispatcher mid-shutdown — hs_err_pid16818 forensics).
          for pid in $(pgrep -f 'paper-26.3' || true); do kill -TERM "$pid" 2>/dev/null || true; done
          for i in $(seq 1 30); do pgrep -f 'paper-26.3' >/dev/null || break; sleep 1; done
          pkill -9 -f "paper-26.3" 2>/dev/null || true
          pkill -9 -f "launcher.jar" 2>/dev/null || true; true
      - name: "Boot #2 (restart — the pack SHA-1 must reproduce exactly)"
        working-directory: dist
        env:
          CLOD_OPTS: "tick_ms=200;region_blocks=512;cell_size=2;particles_per_tick=1024;http_port=8199;center_x=-930;center_z=796"
        run: |
          rm -f in2; mkfifo in2
          tail -f in2 | java -Xmx2G -jar launcher.jar > boot2.log 2>&1 &
          SRV=$!
          exec 9>in2
          for i in $(seq 1 180); do
            if grep -q "pack finalized (ONE-TIME, static)" boot2.log; then break; fi
            if ! kill -0 $SRV 2>/dev/null; then echo "SERVER DIED"; tail -60 boot2.log; exit 1; fi
            sleep 2
          done
          if ! grep -q "pack finalized (ONE-TIME, static)" boot2.log; then
            tail -80 boot2.log; kill -9 $SRV 2>/dev/null || true; exit 1
          fi
          # v5.8: same asynchronous-arm wait as boot #1.
          for i in $(seq 1 60); do
            grep -q "sky-grid stream armed" boot2.log && break
            if ! kill -0 $SRV 2>/dev/null; then echo "SERVER DIED"; tail -60 boot2.log; exit 1; fi
            sleep 2
          done
          grep -q "sky-grid stream armed" boot2.log || { echo "sky-grid stream did not arm"; tail -80 boot2.log; exit 1; }
          for i in $(seq 1 60); do
            grep -q "edit events: listener registered" boot2.log && break
            if ! kill -0 $SRV 2>/dev/null; then echo "SERVER DIED"; tail -60 boot2.log; exit 1; fi
            sleep 2
          done
          grep -q "edit events: listener registered" boot2.log \
            || { echo "FAIL: event push never registered on boot #2"; tail -40 boot2.log; exit 1; }
          echo "--- gates (boot #2) ---"
          python3 ../scripts/e2e/gates.py boot2.log
          echo "--- stopping boot #2 ---"
          kill $SRV 2>/dev/null || true; sleep 3
          for pid in $(pgrep -f 'paper-26.3' || true); do kill -TERM "$pid" 2>/dev/null || true; done
          for i in $(seq 1 30); do pgrep -f 'paper-26.3' >/dev/null || break; sleep 1; done
          pkill -9 -f "paper-26.3" 2>/dev/null || true
          pkill -9 -f "launcher.jar" 2>/dev/null || true; true
      - name: "Pack SHA-1 stability across restarts (v5: deterministic, no snapshot)"
        working-directory: dist
        run: |
          # v5: the pack is byte-deterministic — no atlas snapshot at all.
          # Both boots must report the exact same sha1; clients never
          # re-download even across server restarts.
          S1=$(grep -o 'sha1 [0-9a-f]\{40\}' boot1.log | head -1 | cut -d' ' -f2)
          S2=$(grep -o 'sha1 [0-9a-f]\{40\}' boot2.log | head -1 | cut -d' ' -f2)
          echo "boot1 sha1: $S1"; echo "boot2 sha1: $S2"
          test -n "$S1" && test -n "$S2"
          test "$S1" = "$S2" || { echo "FAIL: restart changed the pack sha1 — clients would re-download"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs
          path: |
            dist/boot1.log
            dist/boot2.log
            dist/logs/server.log

  visual:
    name: visual e2e (real client renders the live-edit proof)
    # Layer 8: the only job that proves the v6.2/v6.3 guarantee ON SCREEN —
    # a block placed mid-session reaches the LOD paint with zero relogs, and
    # the marker survives a kick+rejoin. A genuine vanilla 26.3 client runs
    # under Xvfb on the runner's Mesa llvmpipe (the sRGB GLX shim strips the
    # attribute Mesa cannot satisfy; see scripts/bench/libclodgl.c).
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 50
    # v6.7.2 VERDICT FEED: the run summary/probe counts are committed to the
    # ci-verdicts branch (contents: write) — readable over raw CDN with NO
    # API quota (the artifacts/log endpoints were repeatedly rate-limited
    # for the sandbox egress IPs; the verdict must never be auth-walled
    # again).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: X11 + software GL + python deps
        run: |
          sudo apt-get update -qq
          # mesa-utils (glxinfo): v6.8.3 rides the GL stack version in the
          # verdict — a runner Mesa/llvmpipe bump is a prime suspect for a
          # client that renders nothing.
          sudo apt-get install -y -qq xvfb ffmpeg libgl1 libglx-mesa0 libgl1-mesa-dri mesa-utils
          python3 -m pip install --quiet --user pillow python-xlib
      - name: Build module (release)
        run: cargo build --release
      - name: Build CRUSSTY runtime + launcher
        run: |
          git clone --depth 1 https://github.com/PLANETA9091/CRUSSTY.git crussty
          cargo build --release --manifest-path crussty/runtime/Cargo.toml
          mkdir -p crussty/launcher/out
          javac -d crussty/launcher/out crussty/launcher/src/main/java/dev/dist/launcher/Main.java
          jar cfe crussty/launcher/launcher.jar dev.dist.launcher.Main -C crussty/launcher/out .
      - name: Fetch Paper 26.3
        run: |
          URL=$(curl -s https://fill.papermc.io/v3/projects/paper/versions/26.3/builds/latest \
            | python3 -c "import json,sys;print(json.load(sys.stdin)['downloads']['server:default']['url'])")
          curl -sL -o paper.jar "$URL"
          mkdir -p dist/versions
          cp paper.jar dist/versions/paper-26.3.jar
      # v6.4.6: ClodEdits.tryInit registers with the FIRST ENABLED plugin —
      # on a bare CI server there is none and the v6.3 event push never goes
      # live (edits ~0p/0c/0e the whole session). This one-class plugin is
      # built against the same paper.jar the server runs and exists purely
      # to be enabled.
      - name: Build c-LoD host plugin (ClodEdits needs one enabled plugin)
        run: |
          # v6.4.6.2: paper.jar is a paperclip BOOTSTRAP (no API classes) and
          # paper-api alone is not enough either — JavaPlugin's hierarchy
          # pulls adventure (Plugin -> Keyed -> Namespaced), javac dies with
          # 'cannot access Namespaced'. Verified locally with temurin 25:
          # paper-api + adventure-api + adventure-key (all 26.3.build.235 /
          # 5.2.0) compile ClodHost.class cleanly.
          APIV=$(curl -s https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml \
            | grep -o "26\.3\.build\.[0-9]*-stable" | tail -1)
          echo "paper-api: $APIV"
          B="https://repo.papermc.io/repository/maven-public"
          curl -sL -o paper-api.jar "$B/io/papermc/paper/paper-api/${APIV}/paper-api-${APIV}.jar"
          curl -sL -o adventure-api.jar "$B/net/kyori/adventure-api/5.2.0/adventure-api-5.2.0.jar"
          curl -sL -o adventure-key.jar "$B/net/kyori/adventure-key/5.2.0/adventure-key-5.2.0.jar"
          for j in paper-api adventure-api adventure-key; do
            test -s "$j.jar" || { echo "$j.jar download failed"; exit 1; }
          done
          mkdir -p dist/plugins hostout
          javac -cp paper-api.jar:adventure-api.jar:adventure-key.jar \
            -d hostout scripts/java/host/ClodHost.java \
            || { echo "javac failed"; exit 1; }
          jar cf dist/plugins/clodhost.jar -C hostout clod -C scripts/java/host plugin.yml
      - name: Assemble dist root (fixed seed; view-distance 4 keeps the marker zone pure-LOD)
        run: |
          mkdir -p dist/modules/lod
          cp target/release/liblod.so dist/modules/lod/
          cp module.json dist/modules/lod/
          cp crussty/launcher/launcher.jar dist/
          cp crussty/runtime/target/release/libcrussty_runtime.so dist/
          printf 'eula=true\n' > dist/eula.txt
          {
            echo 'online-mode=false'
            echo 'white-list=false'
            echo 'enforce-secure-profile=false'
            echo 'view-distance=4'
            echo 'simulation-distance=4'
            echo 'server-port=25565'
            echo 'spawn-protection=0'
            echo 'white-list=false'
            echo 'motd=c-LoD visual CI'
            echo 'level-seed=clodbench2026'
          } > dist/server.properties
      - name: sRGB GLX shim
        run: |
          mkdir -p ~/mc-test/shim
          gcc -shared -fPIC -O2 -o ~/mc-test/shim/libGL.so.1 scripts/bench/libclodgl.c -ldl
      - name: Restore vanilla 26.3 client cache (~600 MB)
        uses: actions/cache/restore@v4
        with:
          path: ~/mc-test/client
          key: mc263-client-v1
      - name: Vanilla 26.3 client runtime (official manifest, ~600 MB)
        run: python3 scripts/bench/setup_client.py
      - name: Save vanilla client cache (always — the download is the expensive part)
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/mc-test/client
          key: mc263-client-v1
      - name: "VISUAL — live-edit paint proof (leg 1 no-relog, leg 2 post-relog)"
        env:
          MC_TEST_DIST: ${{ github.workspace }}/dist
        run: |
          export CLOD_JAVA="$JAVA_HOME/bin/java"
          bash scripts/bench/run_ci_visual.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-evidence
          path: |
            /home/runner/mc-test/shots/ci-visual/
            /tmp/client.log
            /tmp/server.log
          if-no-files-found: warn
      - name: Publish verdict feed (ci-verdicts branch)
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NO: ${{ github.run_number }}
        run: |
          # Best-effort by design: the feed must never flip the job's real
          # verdict. summary.md + probe_counts.txt are small text files; the
          # branch serves them via raw.githubusercontent.com (no API quota).
          SRC=/home/runner/mc-test/shots/ci-visual
          if [ ! -f "$SRC/summary.md" ]; then
            echo "no summary.md — nothing to publish"
            exit 0
          fi
          git config user.name "ci-verdict-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin ci-verdicts 2>/dev/null || true
          rm -rf /tmp/vfeed
          git worktree add --detach /tmp/vfeed HEAD
          ( cd /tmp/vfeed && git checkout --orphan ci-verdicts && git rm -rf --quiet . 2>/dev/null || true )
          if git show-ref --verify --quiet refs/remotes/origin/ci-verdicts; then
            ( cd /tmp/vfeed \
              && git rm -rf --quiet . 2>/dev/null || true \
              && git checkout -B ci-verdicts origin/ci-verdicts )
          fi
          cp "$SRC/summary.md" /tmp/vfeed/run-${RUN_ID}.md
          cp "$SRC/summary.md" /tmp/vfeed/latest.md
          [ -f "$SRC/probe_counts.txt" ] && cp "$SRC/probe_counts.txt" /tmp/vfeed/run-${RUN_ID}-probes.txt || true
          # v6.8.3 EYES IN THE FEED: four downscaled JPEGs ride the verdict —
          # the close burst (the renderer pulse), its far twin, the pre-edit
          # baseline and the last probe. Three RENDERER DEAD verdicts in a
          # row (41449086366/41454021639/41454056043) were judged on white-px
          # counters alone; a picture separates a black frame (dead GL) from
          # a live scene with no particles (dead particle render) instantly.
          for pair in "09_burst_close:burst" "09b_burst_far:far" "10_before_edit:baseline" "12_after_edit_probe23:last"; do
            IMG="${pair%%:*}"; TAG="${pair##*:}"
            [ -f "$SRC/$IMG.png" ] || continue
            # the converter lives in a repo file — a heredoc on column 1
            # would break the YAML block scalar (found by the local gate)
            python3 scripts/bench/jpg_to_feed.py "$SRC/$IMG.png" "/tmp/vfeed/run-${RUN_ID}-${TAG}.jpg" 2>/dev/null || true
          done
          # keep the feed light: drop everything beyond the newest 3 runs
          ls /tmp/vfeed/run-*.md 2>/dev/null | sort | head -n -3 | while read -r old; do
            R=$(basename "$old" .md)
            rm -f /tmp/vfeed/"$R".md /tmp/vfeed/"$R"-probes.txt \
                  /tmp/vfeed/"$R"-burst.jpg /tmp/vfeed/"$R"-far.jpg \
                  /tmp/vfeed/"$R"-baseline.jpg /tmp/vfeed/"$R"-last.jpg
          done
          {
            echo "# c-LoD visual verdicts"
            echo
            echo "- run ${RUN_ID} (#${RUN_NO}) ${GITHUB_SHA::7} $(date -u +%FT%TZ): $(grep -c FAIL "$SRC/summary.md" || true) FAIL lines in summary"
          } > /tmp/vfeed/index.md
          cd /tmp/vfeed
          git add -A
          git commit -m "verdict: run ${RUN_ID} (${GITHUB_SHA::7})" || echo "no changes"
          git push origin ci-verdicts \
            && echo "verdict feed updated" \
            || echo "WARN: verdict feed push failed (non-fatal)"
          exit 0

  visual-control:
    name: visual control (pack-free vanilla — the differential arm)
    # v6.8.4 FROZEN-FRAME DISCOVERY: the v6.8.3 screenshots (run 41464836708,
    # ci-verdicts) show the pack client's frame FROZEN mid-boot with live
    # lens panels — "RENDERER DEAD" was actually a dead frame SWAP. This arm
    # runs the SAME client against a PLAIN Paper server (no module, no pack,
    # boot_server.sh CLOD_CONTROL=1) and answers one question with the same
    # console bursts + a 12 s frame-motion probe: does the vanilla renderer
    # draw on this runner at all? PASS -> the pack chain is the killer;
    # FAIL -> the environment (Xvfb/llvmpipe/window) kills it by itself.
    # Evidence only — not in strict (the pack arm's own verdict stays real).
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: X11 + software GL + python deps
        run: |
          # v6.8.5: per-step trace — the #225 control death happened BEFORE
          # its own step (no summary -> no publish), the trace names it.
          mkdir -p ~/mc-test
          echo "$(date -u +%FT%TZ) control X11+GL+pip start" >> ~/mc-test/control-steps.log
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg libgl1 libglx-mesa0 libgl1-mesa-dri mesa-utils
          python3 -m pip install --quiet --user pillow python-xlib
          echo "$(date -u +%FT%TZ) control X11+GL+pip ok" >> ~/mc-test/control-steps.log
      - name: Fetch Paper 26.3
        run: |
          echo "$(date -u +%FT%TZ) control fetch-paper start" >> ~/mc-test/control-steps.log
          URL=$(curl -s https://fill.papermc.io/v3/projects/paper/versions/26.3/builds/latest \
            | python3 -c "import json,sys;print(json.load(sys.stdin)['downloads']['server:default']['url'])")
          curl -sL -o paper.jar "$URL"
          mkdir -p dist/versions
          cp paper.jar dist/versions/paper-26.3.jar
          echo "$(date -u +%FT%TZ) control fetch-paper ok" >> ~/mc-test/control-steps.log
      - name: Prepare control dist (eula + offline server.properties; the module path is deliberately absent)
        run: |
          echo "$(date -u +%FT%TZ) control prepare-dist start" >> ~/mc-test/control-steps.log
          printf 'eula=true\n' > dist/eula.txt
          {
            echo 'online-mode=false'
            echo 'white-list=false'
            echo 'enforce-secure-profile=false'
            echo 'view-distance=6'
            echo 'simulation-distance=6'
            echo 'server-port=25565'
            echo 'motd=c-LoD CI control'
          } > dist/server.properties
          echo "$(date -u +%FT%TZ) control prepare-dist ok" >> ~/mc-test/control-steps.log
      - name: sRGB GLX shim
        run: |
          echo "$(date -u +%FT%TZ) control shim start" >> ~/mc-test/control-steps.log
          mkdir -p ~/mc-test/shim
          gcc -shared -fPIC -O2 -o ~/mc-test/shim/libGL.so.1 scripts/bench/libclodgl.c -ldl
          echo "$(date -u +%FT%TZ) control shim ok" >> ~/mc-test/control-steps.log
      - name: Restore vanilla 26.3 client cache (~600 MB)
        uses: actions/cache/restore@v4
        with:
          path: ~/mc-test/client
          key: mc263-client-v1
      - name: Vanilla 26.3 client runtime (official manifest, ~600 MB)
        run: |
          # v6.8.6: this step had NO trace — run 41472301678's control death
          # (trace ended at "shim ok") could not distinguish "setup died" from
          # "the pulse itself died". Both control legs now trace.
          echo "$(date -u +%FT%TZ) control setup_client start" >> ~/mc-test/control-steps.log
          python3 scripts/bench/setup_client.py
          echo "$(date -u +%FT%TZ) control setup_client ok" >> ~/mc-test/control-steps.log
      - name: Save vanilla client cache (always — the download is the expensive part)
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/mc-test/client
          key: mc263-client-v1
      - name: "CONTROL — pack-free renderer pulse"
        env:
          MC_TEST_DIST: ${{ github.workspace }}/dist
        run: |
          export CLOD_JAVA="$JAVA_HOME/bin/java"
          export CLOD_CONTROL=1
          # v6.8.6: the leg itself tees into ~/mc-test/control-leg.log and
          # traces its stages into control-steps.log (run_ci_visual.sh) —
          # the publisher carries both when no summary.md appears.
          bash scripts/bench/run_ci_visual.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-control-evidence
          path: |
            /home/runner/mc-test/shots/ci-visual/
            /tmp/client.log
            /tmp/server.log
          if-no-files-found: warn
      - name: Publish control verdict (ci-verdicts branch)
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NO: ${{ github.run_number }}
        run: bash scripts/bench/publish_control_feed.sh /home/runner/mc-test/shots/ci-visual "$RUN_ID" "$RUN_NO"

  voxy-reference:
    name: voxy visual reference (ground truth for the marcher look)
    # The user call: c-LoD must look like Voxy, and that judgment needs
    # EVIDENCE — the real Voxy mod (0.2.20-beta, MC 26.3) rendered by a real
    # Fabric client against the same pinned-seed world the c-LoD visual leg
    # uses (clodbench2026, disk center -930,796). This job boots a PLAIN
    # Paper server (no c-LoD module: no pack push, no dust), joins it with a
    # Fabric 26.3 client carrying Fabric API + Sodium 0.9.2 + Voxy, lets the
    # WorldImporter mesh the loaded chunks and shoots the SAME vantage
    # matrix. Evidence only — not a strict gate while the comparison harness
    # matures (Voxy-on-llvmpipe needs the GLSL 4.60 override; flakiness is
    # expected while the recipe settles).
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    timeout-minutes: 50
    # v6.8.1 VOXY FEED: the shots are committed to the voxy-ref branch
    # (contents: write) — raw CDN, NO API quota (the artifact endpoints
    # were repeatedly rate-limited for the sandbox egress IPs; evidence
    # that cannot be read is not evidence).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: X11 + software GL + python deps
        run: |
          # v6.8.3 per-step trace: a pre-boot death used to leave no branch at
          # all (41454056043 died here in 76 s); the marker now carries this
          # log so the step names itself without any API access.
          mkdir -p ~/mc-test
          echo "$(date -u +%FT%TZ) X11+GL+pip start" >> ~/mc-test/voxy-steps.log
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg libgl1 libglx-mesa0 libgl1-mesa-dri libxtst6
          python3 -m pip install --quiet --user pillow
          echo "$(date -u +%FT%TZ) X11+GL+pip ok" >> ~/mc-test/voxy-steps.log
      - name: sRGB GLX shim
        run: |
          echo "$(date -u +%FT%TZ) sRGB shim start" >> ~/mc-test/voxy-steps.log
          mkdir -p ~/mc-test/shim
          gcc -shared -fPIC -O2 -o ~/mc-test/shim/libGL.so.1 scripts/bench/libclodgl.c -ldl
          echo "$(date -u +%FT%TZ) sRGB shim ok" >> ~/mc-test/voxy-steps.log
      - name: Restore vanilla 26.3 client cache (~600 MB)
        uses: actions/cache/restore@v4
        with:
          path: ~/mc-test/client
          key: mc263-client-voxy-v1
      - name: Vanilla 26.3 client runtime (official manifest, ~600 MB)
        run: |
          echo "$(date -u +%FT%TZ) setup_client start" >> ~/mc-test/voxy-steps.log
          python3 scripts/bench/setup_client.py
          echo "$(date -u +%FT%TZ) setup_client ok" >> ~/mc-test/voxy-steps.log
      - name: Fabric layer (loader + fabric-api + sodium + voxy)
        env:
          VOXY_RD: "8"
          VOXY_THREADS: "2"
        run: |
          echo "$(date -u +%FT%TZ) fabric layer start" >> ~/mc-test/voxy-steps.log
          # v6.8.5 FIX (run 41468940410 marker): without CLOD_JAVA the setup
          # script falls back to ~/tools/jdk25/bin/java which does NOT exist
          # on the runner — the fabric installer died in 2 s, exit 127.
          export CLOD_JAVA="$JAVA_HOME/bin/java"
          bash scripts/bench/setup_client_voxy.sh
          echo "$(date -u +%FT%TZ) fabric layer ok" >> ~/mc-test/voxy-steps.log
      - name: Save client+fabric cache (always — the download is the expensive part)
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/mc-test/client
          key: mc263-client-voxy-v1
      - name: "VOXY REFERENCE — clean server + voxy client + shot matrix"
        env:
          VOXY_SERVER_XMX: "1G"
          VOXY_CLIENT_XMX: "2500M"
          VOXY_CLIENT_DIRECT: "768M"
          VOXY_RD: "8"
          VOXY_THREADS: "2"
          VOXY_MESH_WAIT: "240"
          VOXY_LAP_WAIT: "120"
        run: |
          echo "$(date -u +%FT%TZ) voxy leg start" >> ~/mc-test/voxy-steps.log
          export CLOD_JAVA="$JAVA_HOME/bin/java"
          bash scripts/bench/run_voxy_shots.sh
          echo "$(date -u +%FT%TZ) voxy leg ok" >> ~/mc-test/voxy-steps.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voxy-reference-shots
          path: |
            /home/runner/mc-test/voxy-shots/
            /tmp/voxy_client.log
            /tmp/voxy_server.log
          if-no-files-found: warn
      - name: Publish reference feed (voxy-ref branch)
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NO: ${{ github.run_number }}
        run: bash scripts/bench/publish_voxy_feed.sh /home/runner/mc-test/voxy-shots "$RUN_ID" "$RUN_NO"

  strict:
    name: strictness gate (all green)
    needs: [fmt, clippy, test, glsl, build, packaging, e2e-live, visual]
    if: always() && (needs.e2e-live.result == 'success' || needs.e2e-live.result == 'skipped') && (needs.visual.result == 'success' || needs.visual.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Everything passed
        run: "echo 'c-LoD CI: all gates green'"
