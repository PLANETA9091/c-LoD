name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy (deny warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy pedantic (informational)
        env:
          RUSTFLAGS: ""
        run: cargo clippy --all-targets -- -W clippy::pedantic -W clippy::cargo 2>&1 | tail -60 || true

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit + integration tests
        run: cargo test --all-features --workspace
      - name: Doc tests
        run: cargo test --doc

  glsl:
    name: shader validation (glslang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install glslangValidator
        run: |
          curl -sL -o /tmp/glslang.tar.gz \
            "https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-linux-x86_64-release.tar.gz"
          tar xzf /tmp/glslang.tar.gz -C /tmp
          echo "/tmp/bin" >> "$GITHUB_PATH"
      - name: Validate shaders + chain JSONs
        run: bash scripts/check_glsl.sh
      - name: Pack sanity (unit tests build the real pack zip)
        run: cargo test -p lod pack_builds -- --nocapture

  build:
    name: release build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: liblod.so
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: liblod.dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: lod.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (release, deny warnings)
        run: cargo build --release --all-targets
      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: lod-${{ matrix.target }}
          path: |
            target/release/${{ matrix.artifact }}
            module.json
          if-no-files-found: error

  packaging:
    name: module bundle (CRUSSTY tar.gz)
    needs: [fmt, clippy, test, glsl, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - name: Pack like `crussty module pack`
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('module.json'))['version'])")
          mkdir -p "dist/lod-v${VERSION}-linux-x64"
          cp target/release/liblod.so "dist/lod-v${VERSION}-linux-x64/"
          cp module.json "dist/lod-v${VERSION}-linux-x64/"
          tar czf "dist/lod-v${VERSION}-linux-x64.tar.gz" -C dist "lod-v${VERSION}-linux-x64"
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: crussty-bundle
          path: dist/*.tar.gz
          if-no-files-found: error

  e2e-live:
    name: e2e live server (Paper 26.3 + CRUSSTY + static-pack gates)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Build module (release)
        run: cargo build --release
      - name: Build CRUSSTY runtime + launcher
        run: |
          git clone --depth 1 https://github.com/PLANETA9091/CRUSSTY.git crussty
          cargo build --release --manifest-path crussty/runtime/Cargo.toml
          mkdir -p crussty/launcher/out
          javac -d crussty/launcher/out crussty/launcher/src/main/java/dev/dist/launcher/Main.java
          jar cfe crussty/launcher/launcher.jar dev.dist.launcher.Main -C crussty/launcher/out .
      - name: Fetch Paper 26.3
        run: |
          URL=$(curl -s https://fill.papermc.io/v3/projects/paper/versions/26.3/builds/latest \
            | python3 -c "import json,sys;print(json.load(sys.stdin)['downloads']['server:default']['url'])")
          curl -sL -o paper.jar "$URL"
          mkdir -p dist/versions
          cp paper.jar dist/versions/paper-26.3.jar
      - name: Assemble dist root
        run: |
          mkdir -p dist/modules/lod
          cp target/release/liblod.so dist/modules/lod/
          cp module.json dist/modules/lod/
          cp crussty/launcher/launcher.jar dist/
          cp crussty/runtime/target/release/libcrussty_runtime.so dist/
          printf 'eula=true\n' > dist/eula.txt
          {
            echo 'online-mode=false'
            echo 'view-distance=6'
            echo 'simulation-distance=6'
            echo 'server-port=25565'
            echo 'motd=c-LoD CI'
          } > dist/server.properties
      - name: Boot #1 (fresh world, fast static-pack config)
        working-directory: dist
        env:
          CLOD_OPTS: "scan_deadline_secs=60;tick_ms=200;atlas_size=1024;cell_size=4;http_port=8199"
        run: |
          java -Xmx2G -jar launcher.jar > boot1.log 2>&1 &
          SRV=$!
          for i in $(seq 1 180); do
            if grep -q "pack finalized (ONE-TIME, static)" boot1.log; then break; fi
            sleep 2
          done
          if ! grep -q "pack finalized (ONE-TIME, static)" boot1.log; then
            tail -80 boot1.log; kill -9 $SRV 2>/dev/null || true; exit 1
          fi
          echo "--- gates ---"
          python3 ../scripts/e2e/gates.py boot1.log
          echo "--- HTTP pack fetch ---"
          curl -s -o pack1.zip -w "HTTP %{http_code}\n" http://127.0.0.1:8199/clod-pack.zip
          SIZE=$(stat -c%s pack1.zip); test "$SIZE" -gt 1024 || { echo "pack too small: $SIZE"; exit 1; }
          test ! -e c-LoD-atlas.bin.tmp || { echo "stale tmp snapshot"; exit 1; }
          test -f c-LoD-atlas.bin || { echo "atlas cache missing"; exit 1; }
          echo "--- stopping boot #1 ---"
          kill $SRV 2>/dev/null || true; sleep 3
          pkill -9 -f "launcher.jar" || true; sleep 2
          pkill -9 -f "paper-26.3" || true; true
      - name: Boot #2 (restart — atlas cache must reproduce the SAME sha1)
        working-directory: dist
        env:
          CLOD_OPTS: "scan_deadline_secs=60;tick_ms=200;atlas_size=1024;cell_size=4;http_port=8199"
        run: |
          java -Xmx2G -jar launcher.jar > boot2.log 2>&1 &
          SRV=$!
          for i in $(seq 1 180); do
            if grep -q "pack finalized (ONE-TIME, static)" boot2.log; then break; fi
            sleep 2
          done
          if ! grep -q "pack finalized (ONE-TIME, static)" boot2.log; then
            tail -80 boot2.log; kill -9 $SRV 2>/dev/null || true; exit 1
          fi
          grep -q "atlas restored" boot2.log || { echo "atlas cache was not restored"; tail -80 boot2.log; exit 1; }
          echo "--- gates (boot #2) ---"
          python3 ../scripts/e2e/gates.py boot2.log
          echo "--- stopping boot #2 ---"
          kill $SRV 2>/dev/null || true; sleep 3
          pkill -9 -f "launcher.jar" || true; sleep 2
          pkill -9 -f "paper-26.3" || true; true
      - name: Static-pack SHA-1 stability across restarts
        working-directory: dist
        run: |
          S1=$(grep -o 'sha1 [0-9a-f]\{40\}' boot1.log | head -1 | cut -d' ' -f2)
          S2=$(grep -o 'sha1 [0-9a-f]\{40\}' boot2.log | head -1 | cut -d' ' -f2)
          echo "boot1 sha1: $S1"; echo "boot2 sha1: $S2"
          test -n "$S1" && test -n "$S2"
          test "$S1" = "$S2" || { echo "FAIL: restart changed the pack sha1 — clients would re-download"; exit 1; }
          python3 ../scripts/e2e/gates.py boot2.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs
          path: |
            dist/boot1.log
            dist/boot2.log
            dist/logs/server.log

  e2e-visual:
    name: e2e visual client (vanilla 26.3 client on Xvfb, DH-exact matrix)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 45
    # contents:write — the evidence step commits screenshots + zoom crops
    # into docs/e2e-ci/ on master (browsable history of every run's look).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Install X/GL harness deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            xvfb python3-xlib python3-pil ffmpeg libgl1 libglx-mesa0 libgl1-mesa-dri mesa-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build module (release)
        run: cargo build --release
      - name: Build CRUSSTY runtime + launcher
        run: |
          git clone --depth 1 https://github.com/PLANETA9091/CRUSSTY.git crussty
          cargo build --release --manifest-path crussty/runtime/Cargo.toml
          mkdir -p crussty/launcher/out
          javac -d crussty/launcher/out crussty/launcher/src/main/java/dev/dist/launcher/Main.java
          jar cfe crussty/launcher/launcher.jar dev.dist.launcher.Main -C crussty/launcher/out .
      - name: Fetch Paper 26.3
        run: |
          URL=$(curl -s https://fill.papermc.io/v3/projects/paper/versions/26.3/builds/latest \
            | python3 -c "import json,sys;print(json.load(sys.stdin)['downloads']['server:default']['url'])")
          curl -sL -o paper.jar "$URL"
          mkdir -p ~/mc-test/dl && cp paper.jar ~/mc-test/dl/paper-26.3.jar
      - name: Assemble dist root (seeded world + camera-centered atlas)
        env:
          CLOD_CRUSSTY: ${{ github.workspace }}/crussty
          CLOD_JAVA: ${{ env.JAVA_HOME }}/bin/java
        run: bash scripts/bench/setup_server.sh
      - name: Client runtime cache
        uses: actions/cache@v4
        with:
          path: ~/mc-test/client
          key: clod-client-${{ runner.os }}-${{ hashFiles('analysis/mc263/26.3.json') }}
      - name: Rebuild vanilla 26.3 client runtime
        run: python3 scripts/bench/setup_client.py
      - name: Build the sRGB GLX shim
        run: |
          mkdir -p ~/mc-test/shim
          gcc -shared -fPIC -O2 scripts/bench/libclodgl.c -o ~/mc-test/shim/libGL.so.1 -ldl
      - name: Boot + client shot matrix (user reference seed/camera)
        env:
          CLOD_JAVA: ${{ env.JAVA_HOME }}/bin/java
        run: bash scripts/bench/run_full_e2e.sh
      - name: Visual + client-log gates
        run: |
          python3 scripts/e2e/visual_gates.py ~/mc-test/shots /tmp/client.log /tmp/server.log
      - name: Zoom evidence (NEAREST crops of the defect-prone regions)
        if: always()
        run: |
          mkdir -p zoom
          z() { # src x y w h scale tag
            [ -f "$HOME/mc-test/shots/$1" ] || return 0
            ffmpeg -y -loglevel error -i "$HOME/mc-test/shots/$1" \
              -vf "crop=$4:$5:$2:$3,scale=iw*$6:ih*$6:flags=neighbor" "zoom/$1_z_$7.png"
          }
          # reference view: geometry steps, snow terraces, cliff faces
          z 01_user_day.png 320 180 640 360 2 full
          z 01_user_day.png 620 290 320 180 3 snow
          z 01_user_day.png 340 380 320 160 3 left
          z 01_user_day.png 480 300 320 180 3 center
          # yaw sweep horizon bands
          for s in 02_yaw_south 03_yaw_east 04_yaw_north 05_aerial; do
            z "$s.png" 320 250 640 180 2 hor
          done
          # dusk red-band probe + night water-glow probe
          z 06_sunset.png 320 180 640 360 2 full
          z 07_night.png 320 180 640 360 2 full
          z 07_night.png 320 380 640 160 3 water
          ls zoom/
      - name: Commit E2E evidence into the repo (screenshots + zooms + logs)
        if: always()
        run: |
          STAMP=$(date -u +%Y-%m-%d-%H%M)
          DEST="docs/e2e-ci/${STAMP}-${GITHUB_SHA:0:7}"
          mkdir -p "$DEST/zoom"
          cp ~/mc-test/shots/*.png "$DEST"/ 2>/dev/null || true
          cp zoom/*.png "$DEST"/zoom/ 2>/dev/null || true
          cp /tmp/client.log "$DEST"/client.log 2>/dev/null || true
          cp /tmp/server.log "$DEST"/server.log 2>/dev/null || true
          git config user.name "c-LoD CI"
          git config user.email "actions@github.com"
          git add "$DEST"
          git commit -q -m "visual evidence: $DEST [skip ci]" || echo "nothing to commit"
          git push -q origin HEAD:master || echo "evidence push failed (non-fatal)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-visual
          path: |
            zoom/
            /tmp/client.log
            /tmp/server.log

  strict:
    name: strictness gate (all green)
    needs: [fmt, clippy, test, glsl, build, packaging, e2e-live, e2e-visual]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Everything passed
        env:
          R_FMT: ${{ needs.fmt.result }}
          R_CLIPPY: ${{ needs.clippy.result }}
          R_TEST: ${{ needs.test.result }}
          R_GLSL: ${{ needs.glsl.result }}
          R_BUILD: ${{ needs.build.result }}
          R_PACKAGING: ${{ needs.packaging.result }}
          R_E2E_LIVE: ${{ needs.e2e-live.result }}
          R_E2E_VISUAL: ${{ needs.e2e-visual.result }}
        run: |
          red=0
          for pair in "fmt=$R_FMT" "clippy=$R_CLIPPY" "test=$R_TEST" "glsl=$R_GLSL" \
                      "build=$R_BUILD" "packaging=$R_PACKAGING" \
                      "e2e-live=$R_E2E_LIVE" "e2e-visual=$R_E2E_VISUAL"; do
            echo "  $pair"
            case "$pair" in
              *=success|*=skipped) ;;
              *) red=1 ;;
            esac
          done
          if [ "$red" -ne 0 ]; then echo 'some gates are RED'; exit 1; fi
          echo 'c-LoD CI: all gates green'
