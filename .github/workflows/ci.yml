name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy (deny warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy pedantic (informational)
        env:
          RUSTFLAGS: ""
        run: cargo clippy --all-targets -- -W clippy::pedantic -W clippy::cargo 2>&1 | tail -60 || true

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit + integration tests
        run: cargo test --all-features --workspace
      - name: Doc tests
        run: cargo test --doc

  glsl:
    name: shader validation (glslang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install glslangValidator
        run: |
          curl -sL -o /tmp/glslang.tar.gz \
            "https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-linux-x86_64-release.tar.gz"
          tar xzf /tmp/glslang.tar.gz -C /tmp
          echo "/tmp/bin" >> "$GITHUB_PATH"
      - name: Validate shaders + chain JSONs
        run: bash scripts/check_glsl.sh
      - name: Pack sanity (unit tests build the real pack zip)
        run: cargo test -p lod pack_builds -- --nocapture

  build:
    name: release build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: liblod.so
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: liblod.dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: lod.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (release, deny warnings)
        run: cargo build --release --all-targets
      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: lod-${{ matrix.target }}
          path: |
            target/release/${{ matrix.artifact }}
            module.json
          if-no-files-found: error

  packaging:
    name: module bundle (CRUSSTY tar.gz)
    needs: [fmt, clippy, test, glsl, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - name: Pack like `crussty module pack`
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('module.json'))['version'])")
          mkdir -p "dist/lod-v${VERSION}-linux-x64"
          cp target/release/liblod.so "dist/lod-v${VERSION}-linux-x64/"
          cp module.json "dist/lod-v${VERSION}-linux-x64/"
          tar czf "dist/lod-v${VERSION}-linux-x64.tar.gz" -C dist "lod-v${VERSION}-linux-x64"
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: crussty-bundle
          path: dist/*.tar.gz
          if-no-files-found: error

  e2e-live:
    name: e2e live server (Paper 26.3 + CRUSSTY + static-pack gates)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Build module (release)
        run: cargo build --release
      - name: Build CRUSSTY runtime + launcher
        run: |
          git clone --depth 1 https://github.com/PLANETA9091/CRUSSTY.git crussty
          cargo build --release --manifest-path crussty/runtime/Cargo.toml
          mkdir -p crussty/launcher/out
          javac -d crussty/launcher/out crussty/launcher/src/main/java/dev/dist/launcher/Main.java
          jar cfe crussty/launcher/launcher.jar dev.dist.launcher.Main -C crussty/launcher/out .
      - name: Fetch Paper 26.3
        run: |
          URL=$(curl -s https://fill.papermc.io/v3/projects/paper/versions/26.3/builds/latest \
            | python3 -c "import json,sys;print(json.load(sys.stdin)['downloads']['server:default']['url'])")
          curl -sL -o paper.jar "$URL"
          mkdir -p dist/versions
          cp paper.jar dist/versions/paper-26.3.jar
      - name: Assemble dist root
        run: |
          mkdir -p dist/modules/lod
          cp target/release/liblod.so dist/modules/lod/
          cp module.json dist/modules/lod/
          cp crussty/launcher/launcher.jar dist/
          cp crussty/runtime/target/release/libcrussty_runtime.so dist/
          printf 'eula=true\n' > dist/eula.txt
          {
            echo 'online-mode=false'
            echo 'view-distance=6'
            echo 'simulation-distance=6'
            echo 'server-port=25565'
            echo 'motd=c-LoD CI'
          } > dist/server.properties
      - name: Boot #1 (fresh world, streaming config)
        working-directory: dist
        env:
          CLOD_OPTS: "scan_deadline_secs=60;tick_ms=200;atlas_size=1024;cell_size=4;http_port=8199;stream_min_secs=20;stream_min_cells=64"
        run: |
          java -Xmx2G -jar launcher.jar > boot1.log 2>&1 &
          SRV=$!
          for i in $(seq 1 180); do
            if grep -q "pack finalized (base rev 0)" boot1.log; then break; fi
            sleep 2
          done
          if ! grep -q "pack finalized (base rev 0)" boot1.log; then
            tail -80 boot1.log; kill -9 $SRV 2>/dev/null || true; exit 1
          fi
          echo "--- gates ---"
          python3 ../scripts/e2e/gates.py boot1.log
          echo "--- HTTP pack fetch ---"
          curl -s -o pack1.zip -w "HTTP %{http_code}\n" http://127.0.0.1:8199/clod-pack.zip
          SIZE=$(stat -c%s pack1.zip); test "$SIZE" -gt 1024 || { echo "pack too small: $SIZE"; exit 1; }
          test ! -e c-LoD-atlas.bin.tmp || { echo "stale tmp snapshot"; exit 1; }
          test -f c-LoD-atlas.bin || { echo "atlas cache missing"; exit 1; }
          echo "--- stopping boot #1 ---"
          kill $SRV 2>/dev/null || true; sleep 3
          pkill -9 -f "launcher.jar" || true; sleep 2
          pkill -9 -f "paper-26.3" || true; true
      - name: Boot #2 (restart — atlas cache + streaming revision)
        working-directory: dist
        env:
          CLOD_OPTS: "scan_deadline_secs=60;tick_ms=200;atlas_size=1024;cell_size=4;http_port=8199;stream_min_secs=20;stream_min_cells=64;stream_probe=1"
        run: |
          rm -f in2; mkfifo in2
          tail -f in2 | java -Xmx2G -jar launcher.jar > boot2.log 2>&1 &
          SRV=$!
          exec 9>in2
          for i in $(seq 1 180); do
            if grep -q "pack finalized (base rev 0)" boot2.log; then break; fi
            if ! kill -0 $SRV 2>/dev/null; then echo "SERVER DIED"; tail -60 boot2.log; exit 1; fi
            sleep 2
          done
          if ! grep -q "pack finalized (base rev 0)" boot2.log; then
            tail -80 boot2.log; kill -9 $SRV 2>/dev/null || true; exit 1
          fi
          grep -q "atlas restored" boot2.log || { echo "atlas cache was not restored"; tail -80 boot2.log; exit 1; }
          echo "--- gates (boot #2) ---"
          python3 ../scripts/e2e/gates.py boot2.log
          echo "--- stream a revision server-side (stream_probe: virtual player -> frontier force-load -> rebuild) ---"
          grep -q "stream_probe: virtual player" boot2.log || { echo "FAIL: probe never armed"; tail -40 boot2.log; exit 1; }
          REV0=$(curl -s http://127.0.0.1:8199/clod-pack.info | grep '^revision=' | cut -d= -f2)
          echo "revision before: $REV0"
          for i in $(seq 1 240); do
            if grep -q 'pack rebuilt (stream rev 1)' boot2.log; then break; fi
            if ! kill -0 $SRV 2>/dev/null; then echo "SERVER DIED mid-stream"; tail -40 boot2.log; exit 1; fi
            sleep 1
          done
          grep -q 'pack rebuilt (stream rev 1)' boot2.log || { echo 'FAIL: no streamed revision from the probe'; tail -40 boot2.log; exit 1; }
          REV1=$(curl -s http://127.0.0.1:8199/clod-pack.info | grep '^revision=' | cut -d= -f2)
          echo "revision after: $REV1"
          test "$REV1" -gt "$REV0" || { echo "FAIL: HTTP revision did not advance"; exit 1; }
          SHA_Z=$(curl -s http://127.0.0.1:8199/clod-pack.sha1)
          SHA_L=$(grep -o 'sha1 [0-9a-f]\{40\}' boot2.log | tail -1 | cut -d' ' -f2)
          test "$SHA_Z" = "$SHA_L" || { echo "FAIL: served sha1 != log sha1"; exit 1; }
          echo "streamed revision verified server-side: rev $REV0 -> $REV1"
          echo "--- stopping boot #2 ---"
          kill $SRV 2>/dev/null || true; sleep 3
          pkill -9 -f "launcher.jar" || true; sleep 2
          pkill -9 -f "paper-26.3" || true; true
      - name: Pack SHA-1 stability across restarts (last saved state)
        working-directory: dist
        run: |
          # v4.3: boot1 keeps streaming after finalize, so compare the LAST
          # sha1 boot1 shipped (= last atlas snapshot saved) against the base
          # sha1 boot2 restored. Equal bytes = clients never re-download.
          S1=$(grep -o 'sha1 [0-9a-f]\{40\}' boot1.log | tail -1 | cut -d' ' -f2)
          S2=$(grep -o 'sha1 [0-9a-f]\{40\}' boot2.log | head -1 | cut -d' ' -f2)
          echo "boot1 last sha1: $S1"; echo "boot2 base sha1: $S2"
          test -n "$S1" && test -n "$S2"
          test "$S1" = "$S2" || { echo "FAIL: restart changed the pack sha1 — clients would re-download"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs
          path: |
            dist/boot1.log
            dist/boot2.log
            dist/logs/server.log

  strict:
    name: strictness gate (all green)
    needs: [fmt, clippy, test, glsl, build, packaging, e2e-live]
    if: always() && (needs.e2e-live.result == 'success' || needs.e2e-live.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Everything passed
        run: "echo 'c-LoD CI: all gates green'"
