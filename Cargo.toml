[package]
name = "lod"
version = "5.3.0"
edition = "2021"
description = "c-LoD — true server-side LOD for Paper 26.3 via /posteffect + one-time shader-only resource pack. All world data streams as sky-grid dust particles. No Display entities, no client mods, zero textures."
license = "MIT"

[workspace]
exclude = ["cplug-abi", "cplug-sdk"]

[lib]
name = "lod"
crate-type = ["cdylib", "rlib"]

[dependencies]
cplug-abi = { path = "cplug-abi" }
cplug-sdk = { path = "cplug-sdk" }
jvmti-bindings = "2"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "none"

# Vendored with the float accessors the v5.3.1 spawn gate needs
# (Location.getYaw/getPitch return float; upstream has int/long/bool/object only).
[patch.crates-io]
jvmti-bindings = { path = "vendor/jvmti-bindings" }
