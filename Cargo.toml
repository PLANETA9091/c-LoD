[package]
name = "lod"
version = "4.4.0"
edition = "2021"
description = "c-LoD — true server-side LOD for Paper 26.3 via /posteffect + server resource pack. GLSL raymarched distant terrain from a heightmap atlas. No Display entities, no client mods."
license = "MIT"

[workspace]
exclude = ["cplug-abi", "cplug-sdk"]

[lib]
name = "lod"
crate-type = ["cdylib", "rlib"]

[dependencies]
cplug-abi = { path = "cplug-abi" }
cplug-sdk = { path = "cplug-sdk" }
jvmti-bindings = "2"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "none"
